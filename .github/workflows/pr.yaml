name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: example_package
      lowest-dependencies-check: true
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'

  docs:
    name: Docs
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15

  pre-commit:
    name: Pre-commit
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15

  conda-build:
    name: Conda build
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
    with:
      python-versions: '["3.12"]'
      timeout-minutes: 45
