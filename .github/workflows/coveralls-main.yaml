name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coveralls:
    name: Build main coverage baseline
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: example_package
      test-path: tests/unit
