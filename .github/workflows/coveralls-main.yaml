name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coveralls:
    name: Build main coverage baseline
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@f4cec1ba490b4461bfbcfd6362a8587678908a7d # 0.12.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: example_package
      test-path: tests/unit
