name: Weekly Unit Tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: example_package
      lowest-dependencies-check: true
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'
      coverage: false
