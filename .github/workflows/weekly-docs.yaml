name: Weekly Docs Build

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs build
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@853030dbbbef0fb1a3c4e8923f9ec03acfda3924 # 0.16.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]'
      python-versions: '["3.12", "3.13", "3.14"]'
